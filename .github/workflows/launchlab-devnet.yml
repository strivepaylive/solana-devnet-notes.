name: Momentum LaunchLab devnet validation
on:
  push:
    branches: [momentum-raydium-launchlab-devnet]
  pull_request:
    paths:
      - 'launchlab/**'
      - '.github/workflows/launchlab-devnet.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launchlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
